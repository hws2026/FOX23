<!doctype html><meta charset="utf-8"><title>Transition playback check</title><link rel="stylesheet" href="graphics.css"><link rel="stylesheet" href="reference.css?v=flag176"><style>body{margin:0;background:#142733;color:white;font:14px system-ui}nav{padding:12px;display:flex;gap:14px}button,select{padding:8px}#screen{position:relative;width:100%;aspect-ratio:16/9;background:repeating-linear-gradient(0deg,#245f40 0 70px,#297047 70px 140px);overflow:hidden}#stage{transform-origin:top left}#status{padding:12px}</style><nav><label>In<select id="in"><option value="pattern">Team logo tunnel</option><option value="teamwall">Team metal wall</option><option value="networkwall">Network metal wall</option><option value="fade">Fast fade</option></select></label><label>Out<select id="out"><option value="networkwall">Network metal wall</option><option value="pattern">Team logo tunnel</option><option value="teamwall">Team metal wall</option><option value="fade">Fast fade</option></select></label><button id="play">Play complete sequence</button></nav><div id="status">Preview only — no changes to your show.</div><div id="screen"><div id="stage" class="stage"></div></div><script type="module">
import{renderGraphics}from'./graphics.js?v=score175';
const s=await(await fetch('./rehearsal-seed.json')).json(),stage=document.querySelector('#stage');s.program.bug=false;s.program.graphic={type:'none'};s.program.takeId=0;let timer;
new ResizeObserver(()=>stage.style.transform=`scale(${document.querySelector('#screen').clientWidth/1920})`).observe(document.querySelector('#screen'));
document.querySelector('#play').onclick=()=>{clearTimeout(timer);stage.replaceChildren();delete stage.dataset.key;s.preview={type:'transition',team:'away',transitionStyle:'pattern',transition:document.querySelector('#in').value,outTransition:document.querySelector('#out').value};s.program.graphic={...s.preview};s.program.takeId++;renderGraphics(stage,s);document.querySelector('#status').textContent='Entrance → hold → selected exit';timer=setTimeout(()=>{s.program.graphic={type:'none'};s.program.takeId++;renderGraphics(stage,s);},2600);};
</script>
