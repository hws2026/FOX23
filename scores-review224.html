<!doctype html><html><head><meta charset="utf-8"><title>Bottom Scores 224 — local test</title><link rel="stylesheet" href="scores203.css?v=update239"><style>html,body{margin:0;background:#172b28;color:white;font-family:Arial}#stage{position:absolute;width:1920px;height:1080px;transform-origin:top left;background:linear-gradient(130deg,#22402d,#111d29)}nav{position:fixed;top:0;right:0;z-index:100;background:#10151f;padding:10px}button{padding:8px;margin:2px}</style></head><body><nav><button data-time="0">Opening cards</button><button data-time="5000">NFL game 1</button><button data-time="35000">NFL game 2</button><button data-time="64500">Next league cards</button><button data-time="69000">MLB game</button><button id="score">Update score</button><button id="ticker">Toggle ticker</button><button id="bug">Toggle feed bug</button></nav><div id="stage"></div><script type="module">
import{renderBottomScores}from'./scores-render203.js?v=update239';
const team=(id,abbr,score)=>({id,abbr,name:abbr,score,record:'2-1',logo:''});
const games=[{id:'NFL:1',league:'NFL',away:team('1','DAL','7'),home:team('2','PHI','10'),status:'Q2 · 5:21',state:'in',quarter:'Q2',clock:'5:21',down:'2nd & 6',ball:'DAL 30',possession:'1'}, {id:'NFL:2',league:'NFL',away:team('3','BUF','21'),home:team('4','MIA','17'),status:'Final',state:'post'}, {id:'MLB:3',league:'MLB',away:team('5','NYY','2'),home:team('6','BOS','3'),status:'Top 7th',state:'in',detail:'1 B · 2 S · 1 OUT'}, {id:'NBA:4',league:'NBA',away:team('7','LAL','90'),home:team('8','BOS','88'),status:'Q4 · 2:14',quarter:'Q4',clock:'2:14',state:'in'}];
let now=Date.now();games.forEach(g=>g.updatedAt=now);const state={branding:{network:'WLD SPORTS'},bottomScores:{games,leagues:['NFL','MLB','NBA'],league:'ALL',visible:true,feedBugVisible:true,anchor:now,updatedAt:now}};
const stage=document.querySelector('#stage');function fit(){stage.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';}onresize=fit;fit();function draw(){renderBottomScores(stage,state)}
for(const b of document.querySelectorAll('[data-time]'))b.onclick=()=>{state.bottomScores.anchor=Date.now()-Number(b.dataset.time);state.bottomScores.holdAt=Date.now();draw();};document.querySelector('#score').onclick=()=>{games[0].away.score=String(Number(games[0].away.score)+3);draw();};document.querySelector('#ticker').onclick=()=>{state.bottomScores.visible=!state.bottomScores.visible;draw();};document.querySelector('#bug').onclick=()=>{state.bottomScores.feedBugVisible=!state.bottomScores.feedBugVisible;draw();};draw();
</script></body></html>
