<!doctype html><html><head><meta charset="utf-8"><title>Reference additions 219</title><link rel="stylesheet" href="graphics.css"><link rel="stylesheet" href="reference.css?v=ref219"><link rel="stylesheet" href="touchdown.css?v=ref219"><link rel="stylesheet" href="scores203.css"><link rel="stylesheet" href="additions219.css"><style>body{margin:0;background:#151b27;color:white;font:16px Arial}nav{padding:12px;display:flex;gap:8px}button,select{font:inherit;padding:10px}#review-viewport{position:relative;width:100vw;height:56.25vw;background:radial-gradient(ellipse,#344638,#15211b)}</style></head><body><nav><select id="kind"><option value="teamrecord">Team record</option><option value="playerdock">Player dock</option><option value="seasonwall">Season wall</option><option value="event">Touchdown</option><option value="offense">Offensive lineup</option><option value="defense">Defensive lineup</option><option value="scorebug">Scorebug</option></select><button id="in">In</button><button id="out">Out</button><button id="fade">Fast fade out</button><button id="update">Lineup update</button><button id="inspect-exit">Inspect exit artwork</button><button id="titles">League title cards</button></nav><div id="review-viewport"><div id="stage" class="stage"></div></div><p id="status"></p><script type="module">
import{renderGraphics,fitStage}from'./graphics.js?v=ref219';
const s=await(await fetch('test-state171.json')).json();s.branding.network='WLD SPORTS';s.teams.away.secondary='#ffcc22';s.teams.away.roster[0].photo='assets/headshots/nfl-2577417.png';s.program.takeId=1;s.program.graphic={type:'none'};s.preview={type:'none'};s.program.cueLibrary={};fitStage(document.querySelector('#stage'));
const stage=document.querySelector('#stage');let cue,leagueIndex=0;function show(){document.querySelector('#exit-inspection')?.remove();s.bottomScores={visible:false};cue={type:document.querySelector('#kind').value,team:'away',playerId:'away-1',title:'SCORING FIRST',subtitle:'THIS SEASON',stats:[{label:'SCORING FIRST',away:'10–0',home:''},{label:'OPPONENT SCORES FIRST',away:'2–5',home:''}],event:'TOUCHDOWN',flagVariant:'player',transition:'auto',lineupPhase:'title',lineupGroup:0};if(cue.type==='seasonwall'){cue.title='LOST 5 OF FIRST 7 GAMES';cue.subtitle='SEASON RECAP';}s.program.graphic=cue;s.preview=cue;s.program.bug=true;s.program.takeId++;renderGraphics(stage,s);document.querySelector('#status').textContent='Preview: '+cue.type;}
document.querySelector('#in').onclick=show;document.querySelector('#kind').onchange=show;function hide(fade){s.program.cueLibrary[cue.type]={...cue,outTransition:fade?'fade':'auto'};s.preview={...cue,outTransition:fade?'fade':'auto'};s.program.graphic={type:'none'};s.program.bug=false;s.program.takeId++;renderGraphics(stage,s)}document.querySelector('#out').onclick=()=>hide(false);document.querySelector('#fade').onclick=()=>hide(true);document.querySelector('#update').onclick=()=>{cue.lineupPhase=cue.lineupPhase==='players'?'title':'players';s.program.takeId++;renderGraphics(stage,s)};document.querySelector('#titles').onclick=()=>{const league=['NFL','MLB','NBA','MLS'][leagueIndex++%4];s.program.graphic={type:'none'};s.program.bug=false;s.bottomScores={visible:true,league,anchor:Date.now(),leagueNetworks:{NFL:'WLD FOOTBALL',MLB:'WLD BASEBALL',NBA:'WLD BASKETBALL',MLS:'WLD SOCCER'},games:[{id:league+':demo',league,away:{},home:{},state:'pre',status:'DEMO'}]};s.program.takeId++;renderGraphics(stage,s);document.querySelector('#status').textContent='Title: '+league;};document.querySelector('#inspect-exit').onclick=()=>{stage.innerHTML='<div id="exit-inspection" style="position:absolute;left:500px;top:400px;width:920px;height:270px"><img alt="Exit artwork frame 25" style="width:100%;height:100%" src="assets/scorebug-out219/25.svg"></div>';document.querySelector('#status').textContent='Exit artwork at output scale';};show();
</script></body></html>
