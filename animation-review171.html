<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animation check 171</title><link rel="stylesheet" href="./graphics.css?v=20260923-controls105"><link rel="stylesheet" href="./reference.css?v=update238"><link rel="stylesheet" href="./touchdown.css?v=ref219"><link rel="stylesheet" href="./scores203.css?v=update238"><link rel="stylesheet" href="./additions219.css?v=update238"><link rel="stylesheet" href="./audit233.css?v=update238"><style>body{margin:0;background:#294331;color:white;font:16px sans-serif}nav{position:relative;z-index:50;padding:10px}#box{position:relative;width:min(100vw,1280px);aspect-ratio:16/9}button{margin:5px}pre{white-space:pre-wrap}</style><nav><button id="test">Run score regression</button><button id="lower">Team lower third</button><button id="bug">Scorebug</button><button id="away">Away +6</button><button id="home">Home +3</button><button id="intro">Intro in/out</button><button id="lineup">Lineup in/update/out</button><button id="portrait">Portrait frame</button><button id="wide">Wide frame</button><pre id="result">Ready</pre></nav><div id="box"><div id="stage" class="stage"></div></div><script type="module">
import{renderGraphics,fitStage}from'./graphics.js?v=update238';
const s=await(await fetch('test-state171.json')).json(),root=document.querySelector('#stage'),result=document.querySelector('#result');fitStage(root);const draw=()=>renderGraphics(root,s,false);draw();
const wait=ms=>new Promise(r=>setTimeout(r,ms));const score=(side,delta)=>{s.game.scores[side]+=delta;s.revision++;draw();};
document.querySelector('#away').onclick=()=>score('away',6);document.querySelector('#home').onclick=()=>score('home',3);
document.querySelector('#lower').onclick=()=>{s.program.graphic={type:'lowerthird',team:'away',subtitle:'GAME DAY',lowerContext:'TODAY'};s.program.takeId++;draw();};document.querySelector('#bug').onclick=()=>{s.program.graphic={type:'none'};s.program.takeId++;draw();};
document.querySelector('#portrait').onclick=()=>{document.querySelector('#box').style.cssText='width:360px;height:640px;position:relative'};document.querySelector('#wide').onclick=()=>{document.querySelector('#box').style.cssText='width:min(100vw,1200px);height:450px;position:relative'};
document.querySelector('#intro').onclick=async()=>{s.program.graphic={type:'intro',team:'away'};s.program.takeId++;draw();await wait(3600);s.program.graphic={type:'none'};s.program.takeId++;draw();await wait(1200);result.textContent=root.querySelector('.graphics-layer.leaving')?'FAIL exit residue':'PASS intro exit completed';};
document.querySelector('#lineup').onclick=async()=>{s.program.graphic={type:'offense',team:'away',lineupPhase:'title'};s.program.takeId++;draw();await wait(1600);s.program.graphic.lineupPhase='players';draw();await wait(600);s.program.graphic={type:'defense',team:'home',lineupPhase:'title'};s.program.takeId++;draw();await wait(1600);s.program.graphic.lineupPhase='players';draw();await wait(600);s.program.graphic={type:'none'};s.program.takeId++;draw();await wait(1000);result.textContent=root.querySelector('.graphics-layer.leaving,.lineup-outgoing')?'FAIL lineup residue':'PASS offense/defense update and exit completed';};
document.querySelector('#test').onclick=async()=>{let checks=[],startAway=s.game.scores.away,startHome=s.game.scores.home;const check=(v,t)=>{checks.push((v?'PASS ':'FAIL ')+t);result.textContent=checks.join('\n');};await wait(1800);const home=root.querySelector('[data-score-side=home]');score('away',6);check(home.getAnimations({subtree:true}).length===0,'unchanged home has no score animation');const v=root.querySelector('[data-score-side=away] .score-value'),a=v.getAnimations()[0];await wait(90);s.game.distance='8';draw();check(root.querySelector('[data-score-side=away] .score-value')===v&&v.getAnimations()[0]===a,'unrelated data keeps running score timeline');score('home',3);score('away',1);await wait(800);check(root.querySelector('[data-score-side=away]').textContent===String(startAway+7),'rapid away increments settle at 7');check(home.textContent===String(startHome+3),'home settles independently at 3');check(!root.querySelector('.score-old,.score-add'),'temporary nodes removed');draw();check(home.getAnimations({subtree:true}).length===0,'same value never reanimates');};
</script>
