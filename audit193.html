let page=Number(new URLSearchParams(location.search).get("batch")||0),roots=[];const count=6;await document.fonts.ready;
function state(e){const s=structuredClone(source);s.branding.bugScale=1;s.branding.bugBottom=64;s.branding.city='PHILADELPHIA';s.branding.stateAbbr='PA';s.branding.crew=[{name:'GREG OLSEN'},{name:'KEVIN BURKHARDT'},{name:'ERIN ANDREWS'},{name:'TOM RINALDI'}];s.branding.gameStart=new Date(Date.now()+3600000).toISOString();s.preview={...s.preview,title:'',subtitle:'',featureText:'7–1 RECORD IN LAST 8 STARTS',featureFooter:'VS EAGLES',newsText:'A MAJOR UPDATE FROM AROUND THE LEAGUE',leftName:'KEVIN BURKHARDT',rightName:'GREG OLSEN',reporterName:'ERIN ANDREWS',team:'away',playerId:s.lineups.away.quarterback,...e.cue,transition:'auto',outTransition:'auto'};Object.assign(s.game,e.game);s.game.clock.running=false;s.game.playClock.running=false;s.program={...s.program,bug:true,watermark:false,graphic:s.preview,qbStats:{visible:false},takeId:1,cueLibrary:{}};return s;}
async function draw(live=false){const grid=document.querySelector('#grid');grid.replaceChildren();roots=[];const phase=document.querySelector('#phase').value,time=Number(document.querySelector('#time').value);for(const [i,e]of examples.slice(page*count,page*count+count).entries()){const card=document.createElement('article');card.innerHTML='<h2>'+((page*count)+i+1)+'. '+e.name+'</h2><div class="frame"><div class="stage"></div></div>';grid.append(card);const root=card.querySelector('.stage'),s=state(e);fitStage(root);try{if(e.cue.type==='qbstats')s.program.qbStats={...s.preview,visible:true};if(e.cue.type==='countdown')s.program.countdown={...s.preview,visible:true};renderGraphics(root,s);updateClocks(root,s);roots.push({root,s,e});}catch(err){card.append(String(err));}}await new Promise(requestAnimationFrame);await Promise.all([...grid.querySelectorAll('img')].map(x=>x.decode().catch(()=>{})));if(phase==='out'){window.setTimeout=()=>0;for(const {root,s}of roots){for(const a of root.getAnimations({subtree:true})){const t=a.effect.getComputedTiming();if(Number.isFinite(t.endTime))a.finish();}s.program.graphic={type:'none'};s.preview=s.program.graphic;s.program.bug=false;if(s.program.countdown)s.program.countdown.visible=false;if(s.program.qbStats)s.program.qbStats.visible=false;s.program.takeId++;renderGraphics(root,s);}}await new Promise(requestAnimationFrame);if(!live)for(const {root}of roots)for(const a of root.getAnimations({subtree:true})){a.pause();a.currentTime=phase==='hold'?Math.max(0,Number.isFinite(a.effect.getComputedTiming().endTime)?a.effect.getComputedTiming().endTime:1500):time;}document.querySelector('#status').textContent=(page+1)+' / '+Math.ceil(examples.length/count)+' batches · '+examples.length+' variants';document.querySelector('#report').textContent=JSON.stringify(roots.map(({root,e})=>({name:e.name,brokenImages:[...root.querySelectorAll('img')].filter(x=>!x.naturalWidth).map(x=>x.getAttribute('src')),overflow:[...root.querySelectorAll('h1,h2,p,small,strong')].filter(x=>x.clientWidth&&x.scrollWidth>x.clientWidth+3).map(x=>({text:x.textContent,extra:x.scrollWidth-x.clientWidth})),animations:root.getAnimations({subtree:true}).map(a=>({name:a.animationName||'WAAPI',duration:a.effect.getTiming().duration,delay:a.effect.getTiming().delay}))})),null,2);}
document.querySelector('#next').onclick=()=>{page=Math.min(Math.ceil(examples.length/count)-1,page+1);draw()};document.querySelector('#prev').onclick=()=>{page=Math.max(0,page-1);draw()};document.querySelector('#sample').onclick=()=>draw();document.querySelector('#play').onclick=()=>draw(true);document.querySelector('#phase').onchange=()=>draw();const params=new URLSearchParams(location.search);document.querySelector('#phase').value=params.get('phase')||'hold';document.querySelector('#time').value=params.get('time')||'300';draw();</script>
