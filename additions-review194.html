<!doctype html><meta charset="utf-8"><title>Added graphics review 194</title><link rel="stylesheet" href="graphics.css"><link rel="stylesheet" href="reference.css?v=added194"><link rel="stylesheet" href="touchdown.css"><style>body{margin:0;background:#12222d;color:white;font:15px Arial}nav{display:flex;gap:10px;padding:12px;align-items:center;flex-wrap:wrap}button,select,a{font:inherit;padding:9px}a{color:#c9e8ff}#box{height:78vh;position:relative;background:radial-gradient(ellipse at 65% 30%,#61737b,#172d34 65%);overflow:hidden}#caption{padding:10px 14px}#cue{max-width:70vw}</style><nav><a href="./?v=194">Control panel</a><button id="prev">Previous</button><select id="cue" aria-label="Graphic"></select><button id="next">Next</button><button id="in">IN / replay</button><button id="out">OUT</button></nav><div id="caption"></div><div id="box"><div class="stage" id="stage"></div></div><script type="module">import{renderGraphics,fitStage,graphicNames,updateClocks}from'./graphics.js?v=added194';
const source=await(await fetch('rehearsal-seed.json')).json();const league=await(await fetch('nfl-2026.json')).json();for(const t of Object.values(source.teams)){for(const p of t.roster){const match=league.teams.flatMap(x=>x.roster).find(x=>x.id===p.id||x.name.toUpperCase()===p.name.toUpperCase());if(match?.photo)p.photo=match.photo;}}let examples=[];const add=(name,cue)=>examples.push({name,group:'New graphics only',cue,game:{}});
add('Clean venue matchup',{type:'matchupclean'});
add('Matchup · event badge',{type:'matchupbadge',extraBadge:'GAME DAY'});
add('Coming up matchup',{type:'comingupmatchup',title:'COMING UP',extraBadge:'GAME DAY'});
add('Reporter · event badge',{type:'reporterbadge',reporterName:'TOM RINALDI',extraBadge:'GAME DAY'});
add('Broadcast availability',{type:'languagepromo',title:'SPANISH LANGUAGE TELECAST',subtitle:'AVAILABLE ON FOX DEPORTES'});
add('Detailed weather',{type:'weatherdetail',title:'GREEN BAY, WI',subtitle:'LAMBEAU FIELD',weatherTemp:'52°',weatherHumidity:'54%',weatherWind:'SE 8',weatherForecast:'CLOUDY'});
function state(e){const s=structuredClone(source);s.branding.bugScale=1;s.branding.bugBottom=64;s.branding.city='DETROIT';s.branding.stateAbbr='MI';s.branding.venue='FORD FIELD';s.branding.competition='GAME DAY';s.branding.crew=[{name:'GREG OLSEN'},{name:'KEVIN BURKHARDT'},{name:'ERIN ANDREWS'},{name:'TOM RINALDI'}];s.branding.gameStart=new Date(Date.now()+3600000).toISOString();s.preview={...s.preview,title:'',subtitle:'',featureText:'7–1 RECORD IN LAST 8 STARTS',featureFooter:'VS EAGLES',newsText:'A MAJOR UPDATE FROM AROUND THE LEAGUE',leftName:'KEVIN BURKHARDT',rightName:'GREG OLSEN',reporterName:'ERIN ANDREWS',team:'away',playerId:s.lineups.away.quarterback,...e.cue,transition:'auto',outTransition:'auto'};Object.assign(s.game,e.game);s.game.clock.running=false;s.game.playClock.running=false;s.program={...s.program,bug:true,watermark:false,graphic:s.preview,qbStats:{visible:false},takeId:1,cueLibrary:{}};return s;}

const root=document.querySelector('#stage'),select=document.querySelector('#cue');fitStage(root);let current,takeSequence=0;
examples.forEach((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+e.name;select.append(o)});
function show(){const e=examples[Number(select.value)];current=state(e);current.program.takeId=++takeSequence;if(e.cue.type==='qbstats')current.program.qbStats={...current.preview,visible:true};if(e.cue.type==='countdown')current.program.countdown={...current.preview,visible:true};renderGraphics(root,current);updateClocks(root,current);document.querySelector('#caption').textContent=e.group+' · '+e.name+' · isolated demonstration data';}
select.onchange=show;document.querySelector('#in').onclick=()=>{root.replaceChildren();show()};document.querySelector('#out').onclick=()=>{if(!current)return;current.program.graphic={type:'none'};current.program.bug=false;if(current.program.qbStats)current.program.qbStats.visible=false;if(current.program.countdown)current.program.countdown.visible=false;current.program.takeId=++takeSequence;renderGraphics(root,current)};
document.querySelector('#next').onclick=()=>{select.value=(Number(select.value)+1)%examples.length;show()};document.querySelector('#prev').onclick=()=>{select.value=(Number(select.value)+examples.length-1)%examples.length;show()};setInterval(()=>{if(current)updateClocks(root,current)},100);select.value=0;show();</script>
