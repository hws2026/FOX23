<!doctype html><meta charset="utf-8"><title>Reference graphics 192</title><link rel="stylesheet" href="graphics.css"><link rel="stylesheet" href="reference.css?v=added194"><style>body{margin:0;background:#172430;color:white;font:14px Arial}nav{padding:12px;display:flex;gap:8px;flex-wrap:wrap}button{padding:10px}#box{position:relative;width:100vw;height:78vh;background:radial-gradient(ellipse at 65% 30%,#61737b,#172d34 65%)}#comparegrid.comparing{display:grid;grid-template-columns:1fr 1fr;gap:8px}#comparegrid.comparing>#box,#comparegrid.comparing>#reference{width:100%!important;height:auto!important;min-width:0;aspect-ratio:16/9}#comparegrid.comparing #reference img{object-fit:cover!important}</style><nav><button id="compare">Show crew reference</button><button data-cue="conference">Custom logo transition</button><button data-cue="playertease">Player-name teaser</button><button data-cue="serieshistory">Series history</button><button data-cue="crewfour">Four-person crew</button><button data-cue="lowerthird">Existing team lower third</button><button data-cue="splitview">Two-feed layout</button><button data-cue="none">OUT</button></nav><div id="comparegrid"><div id="reference" style="display:none;width:100vw;height:78vh;background:#172d34"><img src="review192-crew.jpg" style="display:block;width:100%;height:100%;object-fit:contain"></div><div id="box"><div id="stage" class="stage"></div></div></div><script type="module">
import{renderGraphics,fitStage}from'./graphics.js?v=added194';document.querySelector('#compare').onclick=()=>{const r=document.querySelector('#reference'),grid=document.querySelector('#comparegrid'),on=!grid.classList.contains('comparing');grid.classList.toggle('comparing',on);r.style.display=on?'block':'none';document.querySelector('#compare').textContent=on?'Close comparison':'Compare crew reference';};const s=await(await fetch('test-state171.json')).json(),root=document.querySelector('#stage');fitStage(root);s.program.bug=false;s.program.watermark=false;s.branding.conferenceAutoColor='#185a9e';s.branding.crew=[{name:'GREG OLSEN'},{name:'KEVIN BURKHARDT'},{name:'ERIN ANDREWS'},{name:'TOM RINALDI'}];let timer;document.querySelectorAll('[data-cue]').forEach(b=>b.onclick=()=>{clearTimeout(timer);let c={type:b.dataset.cue,team:'away',transition:'auto',outTransition:'auto'};if(c.type==='conference')c={...c,type:'transition',transitionStyle:'conference'};if(c.type==='playertease')c.title='TAYLOR HEINICKE';if(c.type==='serieshistory')Object.assign(c,{title:'SERIES HISTORY',subtitle:'187TH MATCHUP ALL-TIME',featureText:'BEARS LEAD SERIES 104-77-5',featureFooter:'3RD MOST PLAYED SERIES\nIN NFL HISTORY'});if(c.type==='splitview')Object.assign(c,{title:'GAME UPDATE',subtitle:'TWO LOCAL FEEDS',featureText:'Select cameras or video files\nin the control panel.',splitLabel1:'FEED 1',splitLabel2:'FEED 2'});if(c.type==='lowerthird')Object.assign(c,{title:'Team information goes here',subtitle:'GAME DAY',lowerContext:'THIS SEASON'});s.preview=c;s.program.graphic=c;s.program.takeId++;renderGraphics(root,s);if(c.transitionStyle==='conference')timer=setTimeout(()=>{s.program.graphic={type:'none'};s.program.takeId++;renderGraphics(root,s);},1050);});document.querySelector('[data-cue=crewfour]').click();</script>
