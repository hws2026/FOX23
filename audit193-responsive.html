<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="graphics.css"><link rel="stylesheet" href="reference.css?v=added194"><link rel="stylesheet" href="touchdown.css"><style>body{margin:0;background:#14232d;color:white}#grid{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.frame{position:relative;overflow:hidden;background:#435b66;flex-shrink:0}pre{white-space:pre-wrap}</style><div id="status">Testing</div><main id="grid"></main><pre id="report"></pre><script type="module">
import{renderGraphics,fitStage,updateClocks}from'./graphics.js?v=added194';
const seed=await(await fetch('rehearsal-seed.json')).json(),results=[];
for(const [w,h,type]of [[320,180,'scorebug'],[540,960,'lowerthird'],[540,540,'offense'],[640,270,'matchup'],[320,180,'crewfour'],[320,180,'referee']]){const frame=document.createElement('div');frame.className='frame';frame.style.width=w+'px';frame.style.height=h+'px';frame.innerHTML='<div class="stage"></div>';document.querySelector('#grid').append(frame);const root=frame.firstElementChild,s=structuredClone(seed);s.game.clock.running=s.game.playClock.running=false;s.program={...s.program,bug:type==='scorebug',watermark:false,graphic:{...s.preview,type,transition:'auto',team:'away',lineupPhase:'players',lineupGroup:0},takeId:1};fitStage(root);renderGraphics(root,s);updateClocks(root,s);await new Promise(requestAnimationFrame);await Promise.all([...root.querySelectorAll('img')].map(x=>x.decode().catch(()=>{})));for(const a of root.getAnimations({subtree:true}))if(Number.isFinite(a.effect.getComputedTiming().endTime))a.finish();const rect=root.getBoundingClientRect(),box=frame.getBoundingClientRect();results.push({type,viewport:[w,h],stage:[rect.width,rect.height],fits:rect.left>=box.left-.1&&rect.top>=box.top-.1&&rect.right<=box.right+.1&&rect.bottom<=box.bottom+.1,ratio:rect.width/rect.height});}
document.querySelector('#report').textContent=JSON.stringify(results,null,2);document.querySelector('#status').textContent='6 responsive cases complete';</script>
