<!doctype html><meta charset="utf-8"><title>Graphics update audit</title><link rel="stylesheet" href="graphics.css"><link rel="stylesheet" href="reference.css?v=update239"><link rel="stylesheet" href="touchdown.css"><link rel="stylesheet" href="./audit233.css?v=update239"><style>body{margin:0;background:#14232d;color:white;font:14px Arial}#grid{width:1280px;display:grid;grid-template-columns:1fr 1fr;gap:4px}h2{font:16px Arial}.frame{position:relative;aspect-ratio:16/9;background:#435b66;overflow:hidden}pre{white-space:pre-wrap}#status{padding:10px}</style><div id="status">Testing</div><div id="grid"></div><pre id="report"></pre><script type="module">
import{renderGraphics,fitStage,updateClocks}from'./graphics.js?v=update239';
const seed=await(await fetch('rehearsal-seed.json')).json(),results=[];
const cases=[['Away +6',s=>s.game.scores.away+=6],['Home +3',s=>s.game.scores.home+=3],['Both scores',s=>{s.game.scores.away=14;s.game.scores.home=21}],['Score correction',s=>{s.game.scores.home=-1}],['Down and distance',s=>{s.game.down='4TH';s.game.distance='GOAL'}],['Flag on',s=>s.game.flag=true],['Timeout removed',s=>s.game.timeouts.away=2],['Possession home',s=>s.game.possession='home'],['Play clock urgent',s=>{s.game.showPlayClock=true;s.game.showInfo=true;s.game.playClock.remaining=4}],['Final OT2',s=>{s.game.quarter='OT';s.game.overtimePeriod=2;s.game.bottomStatus='FINAL'}],['Lineup title → players',s=>{s.program.graphic.lineupPhase='players';s.program.takeId++},'offense'],['Lineup group → next',s=>{s.program.graphic.lineupGroup=1;s.program.takeId++},'defense']];
for(const[name,change,type]of cases){const card=document.createElement('article');card.innerHTML='<h2>'+name+'</h2><div class="frame"><div class="stage"></div></div>';document.querySelector('#grid').append(card);const root=card.querySelector('.stage'),s=structuredClone(seed);s.branding.bugScale=1;s.branding.bugBottom=64;s.game.clock.running=s.game.playClock.running=false;s.game.scores={away:0,home:name==='Score correction'?7:0};s.program={bug:true,graphic:{...s.preview,type:type||'none',team:'away',lineupPhase:type==='offense'?'title':'players',lineupGroup:0,transition:'auto',outTransition:'auto'},takeId:1,qbStats:{visible:false}};s.preview=s.program.graphic;fitStage(root);renderGraphics(root,s);await new Promise(requestAnimationFrame);for(const a of root.getAnimations({subtree:true})){if(Number.isFinite(a.effect.getComputedTiming().endTime))a.finish();}await new Promise(requestAnimationFrame);const bug=root.querySelector('.bug-wrap');if(bug){clearTimeout(bug._motionTimer);bug.classList.remove('bug-enter','bug-return');}change(s);if(name==='Score correction')s.game.scores.home=6;renderGraphics(root,s);updateClocks(root,s);await new Promise(requestAnimationFrame);for(const a of root.getAnimations({subtree:true})){a.pause();a.currentTime=140;}const before=[...root.querySelectorAll('.score-old,.score-value')].map(x=>({text:x.textContent,translate:getComputedStyle(x).translate}));const oldAnims=root.getAnimations({subtree:true});s.game.clock.remaining=899;renderGraphics(root,s);const retained=oldAnims.every(a=>a.effect?.target?.isConnected);results.push({name,scoreLayers:before,unrelatedUpdateKeepsAnimationNodes:retained,animations:root.getAnimations({subtree:true}).map(a=>({name:a.animationName||'WAAPI',duration:a.effect.getTiming().duration})),lineupNames:root.querySelector('.lineup-names')?.textContent});}
document.querySelector('#report').textContent=JSON.stringify(results,null,2);document.querySelector('#status').textContent='12 update cases complete';
</script>
