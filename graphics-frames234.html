<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Full graphics frame audit</title>
<link rel="stylesheet" href="./graphics.css"><link rel="stylesheet" href="./reference.css?v=update238"><link rel="stylesheet" href="./touchdown.css"><link rel="stylesheet" href="./scores203.css?v=update238"><link rel="stylesheet" href="./scores224.css"><link rel="stylesheet" href="./additions219.css?v=update238"><link rel="stylesheet" href="./audit233.css"><link rel="stylesheet" href="./graphics-frames234.css?v=update2382"></head>
<body><header><h1>Full graphics · frame audit</h1><p>Isolated rehearsal · current renderer · no saved-show connection</p></header><nav>
<label>View<select id="view"><option value="grid">All graphics · batches</option><option value="strip">One graphic · frame strip</option></select></label>
<label>Inventory<select id="scope"><option value="default">Every graphic type</option><option value="all">Every variant</option></select></label>
<label>Graphic<select id="case"></select></label>
<label>Stage<select id="phase"><option value="hold">Held</option><option value="in">Entrance</option><option value="update">Content update</option><option value="out">Exit</option><option value="interrupt">OUT during entrance</option><option value="return">OUT → return</option></select></label>
<label>IN style<select id="motion"><option value="auto">Default</option><option value="fade">Fade</option><option value="pattern">Pattern (transitions)</option><option value="teamwall">Team wall (transitions)</option><option value="networkwall">Network wall (transitions)</option></select></label>
<label>OUT style<select id="outMotion"><option value="same">Same as IN</option><option value="auto">Default</option><option value="fade">Fade</option><option value="pattern">Pattern (transitions)</option><option value="teamwall">Team wall (transitions)</option><option value="networkwall">Network wall (transitions)</option></select></label>
<label>Output<select id="surface"><option value="live">Live</option><option value="preview">Preview</option></select></label>
<label>Frame crop<select id="crop"><option value="full">Full 1920 × 1080</option><option value="bottom">Bottom 360 px</option><option value="top">Top 300 px</option><option value="left">Left half</option></select></label>
<label>Start ms<input id="time" type="number" min="0" value="300" step="16.667"></label><label>Frame step ms<input id="step" type="number" min="16.667" value="100" step="16.667"></label>
<label>Team marks<select id="teamMarks"><option value="images">Uploaded team logos</option><option value="text">Text fallback</option></select></label>
<label>Broadcast marks<select id="brandingMarks"><option value="images">Packaged broadcast logos</option><option value="text">Text fallback</option></select></label>
<label><input id="bottom" type="checkbox">Bottom scores</label><label><input id="feed" type="checkbox">Feed scorebug</label><label><input id="bug" type="checkbox">Scorebug underneath</label>
<label>Feed card<select id="feedSlot"><option value="fixture">Case fixture</option><option value="deck">Opening league deck</option><option value="game">Matchup / status</option><option value="away">Away player stats</option><option value="home">Home player stats</option><option value="next">Next league deck</option><option value="mlb">Baseball game</option><option value="doubleheader">Doubleheader game 2</option></select></label>
<label>Feed game state<select id="feedState"><option value="fixture">Case fixture</option><option value="live">Live</option><option value="final-away">Final · away wins</option><option value="final-home">Final · home wins</option><option value="tie">Final · tie</option><option value="scheduled">Scheduled</option><option value="stale">Updates delayed</option></select></label>
<label>Feed motion<select id="feedPlayback"><option value="advance">Advance naturally</option><option value="pin">Pin selected card</option></select></label>
<label>Feed league<select id="feedLeague"><option value="fixture">Case fixture</option><option value="NFL">NFL</option><option value="MLB">MLB</option><option value="UFL">UFL</option></select></label>
<button id="prev">Previous batch</button><button id="next">Next batch</button><button id="sample">Sample frames</button><button id="backFrame">−1 frame</button><button id="forwardFrame">+1 frame</button><button id="play">Play motion</button>
</nav><div id="status" role="status">Loading…</div><p id="fixtureNote">Synthetic game data. Media-source cases use placeholders; hardware and OBS delivery require a separate connected check.</p><main id="grid"></main><section id="review"><label>Finding<input id="note" placeholder="Observed layout, timing or reference mismatch"></label><button id="pass" disabled>Mark these frames reviewed</button><button id="fail" disabled>Record issue</button><button id="export">Export findings</button><span id="coverage"></span></section><details><summary>Rendered frame diagnostics</summary><pre id="report"></pre></details>
<script type="module" src="./graphics-frames234.js?v=update238"></script></body></html>
