<!doctype html><title>Tracking verification</title><button id="start">Run tracking checks</button><pre id="results">Ready</pre><canvas id="field" width="640" height="360"></canvas><script type="module">
import {loadTrackingCV,FieldTracker,transform} from './tracker.js';
start.onclick=async()=>{try{results.textContent='Loading…';const cv=await loadTrackingCV();const base=document.createElement('canvas');base.width=640;base.height=360;const c=base.getContext('2d');c.fillStyle='#397c34';c.fillRect(0,0,640,360);let seed=3;const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296;};for(let i=0;i<2400;i++){c.fillStyle=`rgba(20,45,18,${random()*.5})`;c.fillRect(random()*640,random()*360,2+random()*4,2+random()*4);}c.strokeStyle='#eeeecc';c.lineWidth=2;for(let x=40;x<640;x+=50){c.beginPath();c.moveTo(x,20);c.lineTo(x-30,335);c.stroke();for(let y=90;y<280;y+=55)c.strokeRect(x-10,y,8,3);}const target=field.getContext('2d');const draw=(scale,dx,dy)=>{target.fillStyle='#397c34';target.fillRect(0,0,640,360);target.save();target.translate(dx,dy);target.scale(scale,scale);target.drawImage(base,0,0);target.restore();};draw(1,0,0);const tracker=new FieldTracker(cv),H=[[12,0,100],[0,12,100],[0,0,1]];tracker.start(field,H);let max=0;for(let i=1;i<=30;i++){const s=1+i*.001,dx=i*.4,dy=i*.15;draw(s,dx,dy);const r=tracker.update(field);const q=transform(r.h,20,10),expected=[(340/3*s+dx)*3,(220/3*s+dy)*3];max=Math.max(max,Math.hypot(q[0]-expected[0],q[1]-expected[1]));}if(max>8)throw Error('Tracking drift too high '+max);target.fillStyle='black';target.fillRect(0,0,640,360);let rejected=false;try{tracker.update(field);}catch(e){rejected=true;}if(!rejected)throw Error('Cut not rejected');tracker.reset();results.textContent='PASS: pan + zoom 30 frames, max error '+max.toFixed(2)+'px; scene cut rejected.';}catch(e){results.textContent='FAIL: '+e.stack;}};
</script>
